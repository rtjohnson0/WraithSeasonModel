name: BDL context backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cmd/pull/context.go', '.github/workflows/context-data.yml']
  schedule:
    - cron: '25 6 * * *'
permissions:
  contents: read
concurrency:
  group: bdl-context-backfill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: data/context
          key: context-backfill-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: context-backfill-v1-${{ github.ref_name }}-
      - name: Resume bounded historical context download
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        shell: bash
        run: |
          YEAR=$(date +%Y); MONTH=$(date +%m)
          if [ "$((10#$MONTH))" -ge 8 ]; then SEASON=$YEAR; else SEASON=$((YEAR-1)); fi
          go run ./cmd/pull context -seasons "$SEASON,$((SEASON-1))" -maxminutes 240
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/context
          key: context-backfill-v1-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdl-context-data
          path: data/context
          retention-days: 1
          if-no-files-found: ignore
