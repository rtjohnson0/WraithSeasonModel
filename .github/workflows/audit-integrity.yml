name: Audit integrity checks
on:
  pull_request:
    paths:
      - 'scripts/archive_forward_evidence.py'
      - 'cmd/predict/**'
      - 'scripts/publish_v5_lab.py'
      - 'scripts/test_publish_v5_lab.py'
      - 'site/src/V5LiveEvidence.jsx'
      - 'site/src/V21Lab.jsx'
      - 'site/src/v21-lab.scss'
      - 'internal/opportunity/**'
      - 'internal/rotation/**'
      - 'site/src/V2Methodology.jsx'
      - 'V5_PREDICTION_UPGRADE.md'
      - 'scripts/publish_v21_lab.py'
      - 'scripts/publish_v21_games.py'
      - 'scripts/test_publish_v21_games.py'
      - 'site/src/GameMarketLab.jsx'
      - 'site/src/gameLabData.js'
      - 'site/src/gameLabData.test.js'
      - 'site/src/v21-games.scss'
      - 'scripts/test_publish_v21_lab.py'
      - 'scripts/sync_state.py'
      - 'site/src/V21Lab.jsx'
      - 'site/src/v21LabData.js'
      - 'site/src/v21LabData.test.js'
      - 'site/src/v21-lab.scss'
      - 'site/src/App.jsx'
      - 'site/src/main.jsx'
      - 'site/src/V2.jsx'
      - '.gitignore'
      - 'scripts/closing_line_audit.py'
      - 'scripts/test_forward_clv_audits.py'
      - 'scripts/phase3_v2_shadow.py'
      - 'scripts/prop_history_cache.py'
      - 'scripts/refresh_models.py'
      - 'scripts/test_prop_history_cache.py'
      - 'scripts/test_model_refresh.py'
      - '.github/workflows/prop-history-backfill.yml'
      - 'cmd/rotationaudit/**'
      - 'scripts/test_phase3_v2_shadow.py'
      - 'scripts/daily.sh'
      - 'scripts/pretip.sh'
      - 'scripts/test_near_tip_minutes_context.py'
      - 'scripts/near_tip_window.py'
      - 'scripts/merge_near_tip_snapshots.py'
      - 'scripts/minutes_context_diagnostic.py'
      - '.github/workflows/near-tip-odds.yml'
      - '.github/workflows/daily.yml'
      - '.github/workflows/audit-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate rotation-v4 Go audit and private serialization
        run: go test ./...
      - name: Run synthetic audit tests (no customer data)
        run: |
          python3 -m unittest discover -s scripts -p 'test_*audit*.py' -v
          python3 -m unittest discover -s scripts -p test_near_tip_minutes_context.py -v
          python3 -m unittest discover -s scripts -p test_phase3_v2_shadow.py -v
          python3 -m unittest discover -s scripts -p test_prop_history_cache.py -v
          python3 -m unittest discover -s scripts -p test_model_refresh.py -v
          python3 -m unittest discover -s scripts -p test_publish_v21_lab.py -v
          python3 -m unittest discover -s scripts -p test_publish_v21_games.py -v
          python3 -m unittest discover -s scripts -p test_publish_v5_lab.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Verify V2.1 tab and public/private builds
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
          npm run build:private
