name: Audit integrity checks
on:
  pull_request:
    paths:
      - 'scripts/archive_forward_evidence.py'
      - 'scripts/closing_line_audit.py'
      - 'scripts/test_forward_clv_audits.py'
      - '.github/workflows/audit-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic audit tests (no customer data)
        run: python3 -m unittest discover -s scripts -p test_forward_clv_audits.py -v
